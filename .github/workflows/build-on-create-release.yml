name: Build on Release created

on:
  release:
    types:
      - created
#on: push

jobs:
  build-macos:
    name: Build macOS Packages
    
    runs-on: macos-latest
    
    strategy:
      matrix:
        arch: [x64, arm64]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Checkout submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - run: brew install libomp
      - run: mkdir build && mkdir output
      - run: cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }} -G "CodeBlocks - Unix Makefiles" -S ./ -B build
      - run: cmake --build ./build --target LunarSlicer -- -j 12
      - run: ./build/LunarSlicer version
      - run: ./build/LunarSlicer ptest
      - run: cp ./build/LunarSlicer ./output/LunarSlicer

      - name: import apple code-signing
        uses: apple-actions/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ secrets.CERTIFICATES_P12 }}
          p12-password: ${{ secrets.CERTIFICATES_P12_PASSWORD }}

      - name: Sign macOS binary
        run: |
          # 使用单引号来处理证书名称中的特殊字符
          codesign -s '${{ secrets.CERTIFICATES_NAME }}' ./output/LunarSlicer

      - name: Zip output
        uses: thedoctor0/zip-release@master
        with:
          type: zip
          filename: LunarSlicer-mac-${{ matrix.arch }}.zip
          directory: ./
          path: ./output

      - name: Upload Release Asset - macOS Binary file
        uses: softprops/action-gh-release@v1
        with:
          files: LunarSlicer-mac-${{ matrix.arch }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows packages
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Checkout submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - run: mkdir build && mkdir output
      - run: cmake -DCMAKE_BUILD_TYPE=Release -G "CodeBlocks - MinGW Makefiles" -S ./ -B build
      - run: cmake --build ./build --target LunarSlicer -- -j 12
      - run: ./build/LunarSlicer.exe version && ./build/LunarSlicer.exe ptest
      - run: cp ./build/LunarSlicer.exe ./output/LunarSlicer.exe

      - name: Zip output
        uses: thedoctor0/zip-release@master
        with:
          type: zip
          filename: LunarSlicer-win64.zip
          directory: ./
          path: ./output

      - name: Upload Release Asset - Windows Binary file
        uses: softprops/action-gh-release@v1
        with:
          files: ./LunarSlicer-win64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ubuntu:
    name: Build Ubuntu packages
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        arch: [x64, arm64]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Checkout submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev libomp-dev

      - run: mkdir build && mkdir output
      
      - name: Setup ARM64 cross-compilation
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CMAKE_ARGS=-DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++" >> $GITHUB_ENV
      
      - run: cmake -DCMAKE_BUILD_TYPE=Release ${{ env.CMAKE_ARGS }} -G "CodeBlocks - Unix Makefiles" -S ./ -B build
      - run: cmake --build ./build --target LunarSlicer -- -j $(nproc)
      
      - name: Run tests
        if: matrix.arch == 'x64'
        run: |
          ./build/LunarSlicer version
          ./build/LunarSlicer ptest
      
      - run: cp ./build/LunarSlicer ./output/LunarSlicer

      - name: Zip output
        uses: thedoctor0/zip-release@master
        with:
          type: zip
          filename: LunarSlicer-linux-${{ matrix.arch }}.zip
          directory: ./
          path: ./output

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: LunarSlicer-linux-${{ matrix.arch }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
